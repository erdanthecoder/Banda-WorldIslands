<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Mega Obby · Marbly</title>
<meta name="description" content="A Roblox-style obstacle course: 36 stages through candy, lava, ice, jungle, space and sky. Beat it with friends and bots!">
<meta name="theme-color" content="#0e1622">
<link rel="icon" href="/img/favicon.png" type="image/png">

<style>
.ob-card { position: fixed; top: 64px; left: 10px; z-index: 16; min-width: 150px; padding: 9px 14px 11px; border-radius: 18px; background: rgba(10,16,28,.82); color: #fff; backdrop-filter: blur(6px); border: 2px solid var(--zc, #ff5fa2); box-shadow: 0 8px 24px rgba(0,0,0,.3); pointer-events: none; }
.ob-zone { font-weight: 800; font-size: 12px; color: var(--zc, #ff5fa2); text-transform: uppercase; letter-spacing: .05em; white-space: nowrap; }
.ob-st { display: flex; align-items: baseline; gap: 6px; } .ob-st small { font-weight: 800; font-size: 11px; opacity: .7; } .ob-st b { font-size: 46px; line-height: 1.05; font-weight: 900; } .ob-st i { font-style: normal; opacity: .6; font-weight: 800; }
.ob-row { display: flex; gap: 12px; font-weight: 800; font-size: 14px; font-variant-numeric: tabular-nums; }
.ob-bar { height: 6px; border-radius: 9px; background: rgba(255,255,255,.15); margin-top: 7px; overflow: hidden; } .ob-bar i { display: block; height: 100%; background: var(--zc, #ff5fa2); transition: width .4s; }
.ob-board { position: fixed; top: 64px; right: 10px; z-index: 16; width: 210px; padding: 8px 10px; border-radius: 16px; background: rgba(10,16,28,.78); color: #fff; backdrop-filter: blur(6px); }
.ob-board h4 { margin: 0 0 6px; display: flex; justify-content: space-between; align-items: center; font-size: 13px; cursor: pointer; } .ob-board h4 .x-btn { padding: 2px 8px; font-size: 15px; }
.ob-board ol, .ob-wins { margin: 0; padding: 0; list-style: none; display: grid; gap: 3px; font-size: 13px; }
.ob-board li, .ob-wins li { display: flex; gap: 7px; align-items: center; padding: 3px 7px; border-radius: 8px; background: rgba(255,255,255,.07); }
.ob-board li span, .ob-wins li span { width: 18px; opacity: .7; font-weight: 800; } .ob-board li b, .ob-wins li b { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 700; } .ob-board li em, .ob-wins li em { font-style: normal; font-weight: 800; }
.ob-board li.me { background: rgba(255,211,77,.28); } .ob-board.min ol { display: none; }
.ob-wins li { font-size: 16px; padding: 6px 10px; background: rgba(0,0,0,.05); }
@media (max-width: 760px) { .ob-card { top: 58px; min-width: 0; padding: 6px 10px 8px; } .ob-st b { font-size: 30px; } .ob-row { font-size: 12px; gap: 8px; } .ob-zone { font-size: 10px; } .ob-board { top: 58px; width: 136px; font-size: 11px; padding: 6px 7px; } .ob-board ol { font-size: 11px; } .ob-board li { padding: 2px 5px; gap: 4px; } }
</style>
